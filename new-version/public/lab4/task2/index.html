<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Задание 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      #cards {
        display: flex;
        gap: 12px;
        margin-bottom: 10px;
      }
      #cards img {
        opacity: 0.2;
        height: 36px;
        transition: opacity 0.2s ease;
      }
      #cards img.hl {
        opacity: 1;
      }
      #result {
        margin-top: 8px;
        color: #374151;
      }
      input[type="text"] {
        width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="cards" aria-hidden="true">
      <img src="img/visa.jpg" id="visa" alt="VISA" />
      <img src="img/mc.jpg" id="mc" alt="MasterCard" />
      <img src="img/visael.jpg" id="visael" alt="Visa Electron" />
      <img src="img/maestro.jpg" id="maestro" alt="Maestro" />
      <img src="img/jcb.jpg" id="jcb" alt="JCB" />
      <img src="img/mir.jpg" id="mir" alt="МИР" />
    </div>
    <div>
      <input
        type="text"
        id="cardNumber"
        value="4300111122223333"
        placeholder="16
цифр"
      />
      <button id="cardCheck" type="button">Проверить</button>
      <div id="result"></div>
    </div>
    <script src="cards.js" defer></script>
  </body>
</html>
