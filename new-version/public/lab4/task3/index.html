<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Задание 3</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: oklch(0.96 0 264);
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .clock {
        background-color: oklch(1 0 264);
        font-size: 48px;
        font-weight: 600;
        letter-spacing: 2px;
        padding: 16px;
        border-radius: 22px;
        box-shadow: inset 0 1px 2px #ffffff50, 0 2px 4px #00000030,
          0 4px 8px #00000015;
      }
    </style>
  </head>
  <body>
    <div id="digitalClock" class="clock" aria-live="polite" role="timer">
      --:--:--
    </div>

    <script src="js/script.js" defer></script>
  </body>
</html>
