<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/404_style.css" />
    <title>Ошибка 404</title>
    <style>
      * {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #191a1a;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        text-align: center;
      }

      h1 {
        color: #e8e8e3;
        font-size: 8rem;
      }

      h2 {
        color: #e8e8e3;
        font-size: 2.5rem;
      }

      p {
        color: #656664;
        font-size: 1.5rem;
      }

      .button-style {
        background-color: #1f2121;
        border-radius: 12px;
        color: #e8e8e3;
        text-decoration: none;
        padding: 8px 12px;
        font-size: 1rem;
        border: 1px solid #333535;
        transition: all 0.333s;
      }

      .button-style:hover {
        background-color: #2d2f2f;
      }
      .button-style:active {
        scale: 0.95;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>СТРАНИЦА НЕ НАЙДЕНА</h2>
      <p>Запрашиваемая страница не сущесвует или была перемещена.</p>
      <a href="/" class="button-style">На главную</a>
    </div>
  </body>
</html>
