<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 8</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        max-width: 500px;
        align-self: center;
      }
      input {
        padding: 5px;
        width: 200px;
        margin-right: 10px;
      }
      button {
        padding: 5px 10px;
        margin-right: 5px;
        cursor: pointer;
      }
      .weather {
        margin-top: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }
      .history {
        margin-top: 10px;
      }
      .history button {
        margin: 2px;
        padding: 3px 6px;
      }
    </style>
  </head>
  <body>
    <h1>Погода в городе</h1>

    <input type="text" id="cityInput" placeholder="Введите город" />
    <button id="getWeatherBtn">Показать погоду</button>
    <button id="clearCacheBtn">Очистить кэш</button>

    <div id="weatherResult" class="weather"></div>

    <div class="history">
      <h3>Последние города:</h3>
      <div id="historyBtns"></div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
