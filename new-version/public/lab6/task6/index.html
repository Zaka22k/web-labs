<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Задание 6</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Анкета участника</h2>

      <form id="userForm">
        <label>Фамилия:</label>
        <input type="text" name="surname" required />

        <label>Имя:</label>
        <input type="text" name="name" required />

        <label>Отчество:</label>
        <input type="text" name="patronymic" />

        <label>Пол:</label>
        <div class="radio-group">
          <label
            ><input type="radio" name="gender" value="Мужской" required />
            Мужской</label
          >
          <label
            ><input type="radio" name="gender" value="Женский" /> Женский</label
          >
        </div>

        <label>Факультет:</label>
        <select name="faculty" required>
          <option value="">Выберите...</option>
          <option>Факультет информатики</option>
          <option>Факультет экономики</option>
          <option>Факультет права</option>
        </select>

        <div class="checkbox-group">
          <label>
            <input type="checkbox" name="participate" /> Участие в проекте
          </label>
        </div>

        <div id="projectDiv" style="display: none">
          <label>Наименование проекта:</label>
          <input type="text" name="project" />
        </div>

        <div class="buttons">
          <button type="button" id="saveBtn">Сохранить</button>
          <button type="submit">Отправить</button>
        </div>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
