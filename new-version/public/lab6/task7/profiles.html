<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сохранённые профили</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin-bottom: 10px;
        border: 1px solid #ccc;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 6px;
      }
      img {
        border-radius: 50%;
      }
      button {
        padding: 3px 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Список сохранённых профилей</h1>
    <ul id="profilesList"></ul>

    <script>
      const profilesList = document.getElementById("profilesList");

      function loadProfiles() {
        const saved = localStorage.getItem("userProfiles");
        return saved ? JSON.parse(saved) : [];
      }

      function saveProfiles(profiles) {
        localStorage.setItem("userProfiles", JSON.stringify(profiles));
        renderProfiles();
      }

      function renderProfiles() {
        const profiles = loadProfiles();
        profilesList.innerHTML = "";
        profiles.forEach((profile) => {
          const li = document.createElement("li");
          li.innerHTML = `
          <img src="${profile.picture}" alt="" width="50">
          <span>${profile.name}, ${profile.gender}, ${profile.email}, ${profile.country}</span>
          <button data-id="${profile.id}">Удалить</button>
        `;
          profilesList.appendChild(li);
        });
      }

      profilesList.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
          const id = e.target.dataset.id;
          let profiles = loadProfiles();
          profiles = profiles.filter((p) => p.id !== id);
          saveProfiles(profiles);
        }
      });

      window.addEventListener("DOMContentLoaded", renderProfiles);
    </script>
  </body>
</html>
