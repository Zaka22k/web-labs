<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 6</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="password-generator">
      <h1>Генератор случайных паролей</h1>

      <label>
        Длина пароля (6–32):
        <input type="number" id="length" min="6" max="32" value="12" />
      </label>

      <fieldset>
        <legend>Типы символов</legend>
        <label
          ><input type="checkbox" id="lowercase" checked /> Буквы нижнего
          регистра</label
        >
        <label
          ><input type="checkbox" id="uppercase" checked /> Буквы верхнего
          регистра</label
        >
        <label><input type="checkbox" id="numbers" checked /> Цифры</label>
        <label
          ><input type="checkbox" id="symbols" /> Специальные символы
          (!@#$...)</label
        >
      </fieldset>

      <button id="generate">Сгенерировать пароль</button>

      <div class="output">
        <input
          type="text"
          id="password"
          readonly
          placeholder="Ваш пароль появится здесь"
        />
        <button id="copy">Копировать в буфер</button>
      </div>
    </section>

    <script src="js/script.js" defer></script>
  </body>
</html>
