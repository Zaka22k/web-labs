<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 7</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="multiplication-table">
      <h1>Генератор таблицы умножения</h1>

      <label>
        Кол-во строк (1–20):
        <input type="number" id="rows" min="1" max="20" value="10" />
      </label>
      <label>
        Кол-во столбцов (1–20):
        <input type="number" id="cols" min="1" max="20" value="10" />
      </label>
      <button id="createTable">Создать таблицу</button>

      <div id="tableContainer"></div>

      <div id="modal" class="modal">
        <div class="modal-content">
          <span id="closeModal" class="close">&times;</span>
          <p id="cellInfo"></p>
        </div>
      </div>
    </section>

    <script src="js/script.js" defer></script>
  </body>
</html>
