<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Задание 1</title>
  </head>
  <body>
    <div class="content">
      <h1>Задание 1</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Qui unde error,
        amet ab ipsum obcaecati quidem dolores laborum, impedit assumenda
        mollitia. Itaque placeat ipsam accusamus facilis, rerum impedit nemo ut!
      </p>
      <div id="result"></div>
    </div>
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="modal">
      <div class="modal-content" id="modalContent">
        <h2>Подпишитесь на новости сайта</h2>
        <input
          type="email"
          id="emailInput"
          name="email"
          placeholder="you@example.com"
          required
        />
        <div id="emailError" class="error" aria-live="polite"></div>
        <div>
          <button class="subscribe" data-action="subscribe">Подписаться</button>
          <button class="close" data-action="close">Закрыть</button>
        </div>
      </div>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
