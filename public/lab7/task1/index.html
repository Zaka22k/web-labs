<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Задание 1</h1>

    <div class="calculator">
      <div class="input-container">
        <input type="number" id="a" placeholder="Введите число A" step="any" />
      </div>

      <div class="input-container">
        <select id="operation">
          <option value="add">Сложить (+)</option>
          <option value="subtract">Вычесть (−)</option>
          <option value="multiply">Умножить (×)</option>
          <option value="divide">Разделить (÷)</option>
        </select>
      </div>

      <div class="input-container">
        <input type="number" id="b" placeholder="Введите число B" step="any" />
      </div>

      <button id="calcBtn">Вычислить</button>

      <div id="result"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
