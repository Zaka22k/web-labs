<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Задание 2</h1>

    <div class="form">
      <input type="text" id="lastname" placeholder="Фамилия" />
      <input type="text" id="firstname" placeholder="Имя" />
      <input type="text" id="middlename" placeholder="Отчество" />

      <div class="radio-group">
        <label>Пол</label>
        <div class="radio-option">
          <input type="radio" name="gender" value="male" id="male" checked />
          <label for="male">Мужской</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="gender" value="female" id="female" />
          <label for="female">Женский</label>
        </div>
      </div>

      <select id="faculty">
        <option value="Физика">Физика</option>
        <option value="Математика">Математика</option>
        <option value="Информатика">Информатика</option>
        <option value="Экономика">Экономика</option>
      </select>

      <div class="checkbox-wrapper">
        <input type="checkbox" id="participate" />
        <label for="participate">Участие в проекте</label>
      </div>

      <input type="text" id="projectName" placeholder="Название проекта" />

      <button id="saveBtn">Сохранить</button>

      <div id="result"></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
