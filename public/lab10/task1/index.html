<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Задание 1</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Магазин</h1>
        <div id="auth-container">
          <form id="loginForm">
            <input
              type="text"
              id="loginUsername"
              placeholder="Логин"
              required
            />
            <input
              type="password"
              id="loginPassword"
              placeholder="Пароль"
              required
            />
            <button type="submit">Войти</button>
          </form>
          <div id="loggedInContainer" class="hidden">
            <span>Привет, <strong id="loggedInUsername"></strong>!</span>
            <a href="orders.html" class="nav-link">Мои заказы</a>
            <a href="cart.html" class="nav-link"
              >Корзина (<span id="cart-count">0</span>)</a
            >
            <a id="adminLink" href="admin.html" class="nav-link hidden"
              >Админ</a
            >
            <button id="logoutButton">Выход</button>
          </div>
        </div>
      </div>

      <div id="products">
        <div class="product"><h3>Загрузка товаров...</h3></div>
      </div>
    </div>
    <script src="js/script.js" defer></script>
  </body>
</html>
