<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Задание 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Задание 1</h1>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Всего наименований</div>
          <div class="stat-value" id="total-products">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Единиц товара</div>
          <div class="stat-value" id="total-items">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Общая стоимость</div>
          <div class="stat-value" id="total-value">0.00 ₽</div>
        </div>
      </div>

      <section class="form-section">
        <h2>Новый товар</h2>
        <div class="form-row">
          <div class="form-group">
            <label>Название</label>
            <input type="text" id="title" placeholder="Наименование..." />
          </div>
          <div class="form-group">
            <label>Цена</label>
            <input type="number" id="price" step="0.01" placeholder="0.00" />
          </div>
          <div class="form-group">
            <label>Кол-во</label>
            <input type="number" id="amount" min="0" value="0" />
          </div>
          <button onclick="addProduct()">Добавить</button>
        </div>
      </section>

      <div class="search-section">
        <input
          type="text"
          id="search"
          placeholder="Поиск по товару..."
          oninput="onSearchInput()"
        />
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Цена</th>
            <th>Остаток</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="products-list-body">
          <tr>
            <td colspan="5" style="text-align: center">Загрузка...</td>
          </tr>
        </tbody>
      </table>
    </div>
    <script src="script.js"></script>
  </body>
</html>
