<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Задание 2</h1>

      <div class="stock" id="stock">Загрузка статистики...</div>

      <div class="dashboard">
        <div class="panel">
          <h2>Добавить новый товар</h2>
          <div class="form-row">
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="new-title" placeholder="Название товара" />
            </div>
            <div class="form-group">
              <label>Цена (₽)</label>
              <input
                type="number"
                id="new-price"
                placeholder="0.00"
                step="0.01"
              />
            </div>
            <div class="form-group">
              <label>Количество</label>
              <input type="number" id="new-amount" placeholder="0" value="1" />
            </div>
            <button class="btn-success" onclick="addProduct()">Добавить</button>
          </div>
        </div>

        <div class="panel">
          <h2>Найти товар по ID</h2>
          <div class="product-search">
            <div class="form-row">
              <div class="form-group">
                <label>ID товара</label>
                <input type="number" id="get-id" placeholder="Введите ID" />
              </div>
              <button onclick="getById()">Найти</button>
            </div>
            <div id="single-product"></div>
          </div>
        </div>
      </div>

      <div class="edit-section">
        <div class="edit-header">
          <h2>Редактирование товаров</h2>
          <button class="btn-success" onclick="saveAllChanges()">
            Сохранить все изменения
          </button>
        </div>

        <div id="products-table">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Цена (₽)</th>
                <th>Количество</th>
                <th>Действие</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="5">Загрузка...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
