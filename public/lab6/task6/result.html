<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Результат формы</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Данные пользователя</h1>
      <table id="resultTable"></table>
    </div>

    <script>
      const table = document.getElementById("resultTable");
      const saved = localStorage.getItem("submittedData");

      if (saved) {
        const data = JSON.parse(saved);
        delete data.participate;

        for (const key in data) {
          if (!data[key] && key === "Проект") continue;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${key}</td>
            <td>${data[key]}</td>
          `;
          table.appendChild(tr);
        }
      } else {
        table.innerHTML = `<tr><td colspan="2" style="text-align:center; color:gray; padding:20px;">Нет сохранённых данных</td></tr>`;
      }
    </script>
  </body>
</html>
