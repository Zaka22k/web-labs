<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задание 8</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Погода</h1>

      <div class="input-group">
        <input
          type="text"
          id="cityInput"
          placeholder="Введите название города"
        />
        <button id="getWeatherBtn">Найти</button>
        <button id="clearCacheBtn">Очистить кэш</button>
      </div>

      <div id="weatherResult" class="weather-card">
        <p style="color: gray; text-align: center; margin-top: 30px">
          Введите город для получения прогноза
        </p>
      </div>

      <div class="history">
        <h3>Недавние поиски</h3>
        <div id="historyBtns"></div>
      </div>
    </div>
    <script src="script.js" defer></script>
  </body>
</html>
