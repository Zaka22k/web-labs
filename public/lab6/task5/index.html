<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Задание 5</title>
  </head>
  <body>
    <h1>Галерея животных</h1>

    <div class="animal-selector">
      <label>
        <input type="radio" name="animal" value="dog" checked />
        <span>Собака</span>
      </label>
      <label>
        <input type="radio" name="animal" value="cat" />
        <span>Кошка</span>
      </label>
    </div>

    <div class="controls">
      <button id="loadBtn">Загрузить</button>
      <button id="favBtn" disabled>В избранное</button>
    </div>

    <div class="image-container">
      <img id="animalImg" src="" alt="" />
    </div>

    <h2>Избранное</h2>
    <ul id="favoritesList"></ul>

    <script src="script.js" defer></script>
  </body>
</html>
