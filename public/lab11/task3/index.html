<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Задание 3</title>
    <style>
      :root {
        --TextFillColorPrimaryBrush: hsl(0, 0%, 10%);
        --TextFillColorSecondaryBrush: hsl(0, 0%, 36%);
        --AccentTextFillColorPrimaryBrush: hsl(215, 100%, 29%);
        --ControlSolidFillColorDefaultBrush: hsl(0, 0%, 100%);
        --SubtleFillColorSecondaryBrush: hsl(0, 0%, 92%);
        --ControlStrokeColorDefaultBrush: hsl(0, 0%, 90%);
        --ControlStrongStrokeColorDefaultBrush: hsl(0, 0%, 53%);
        --CardStrokeColorDefaultBrush: hsl(0, 0%, 90%);
        --LayerFillColorDefaultBrush: hsl(0, 0%, 98%);
        --LayerFillColorAltBrush: hsl(0, 0%, 100%);
        --CardBackgroundFillColorDefaultBrush: hsl(0, 0%, 98%);
      }

      body {
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui,
          sans-serif;
        background-color: var(--LayerFillColorDefaultBrush);
        color: var(--TextFillColorPrimaryBrush);
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        line-height: 1.6;
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        color: var(--TextFillColorPrimaryBrush);
        margin-bottom: 8px;
      }

      p {
        color: var(--TextFillColorSecondaryBrush);
        margin-bottom: 24px;
        font-size: 14px;
      }

      .task-list {
        list-style-type: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .task-list li {
        margin-bottom: 0;
        border-radius: 4px;
        transition: background-color 0.1s;
        background-color: var(--LayerFillColorAltBrush);
        border: 1px solid var(--CardStrokeColorDefaultBrush);
      }

      .task-list li:hover {
        background-color: var(--SubtleFillColorSecondaryBrush);
        border-color: var(--ControlStrokeColorDefaultBrush);
      }

      .task-list a {
        display: block;
        text-decoration: none;
        font-size: 14px;
        font-weight: 400;
        color: var(--TextFillColorPrimaryBrush);
        padding: 12px 16px;
      }

      .task-list li:hover a {
        color: var(--AccentTextFillColorPrimaryBrush);
      }
    </style>
  </head>
  <body>
    <h1>Задание 3</h1>
    <p>Выберите задание для просмотра:</p>
    <ul class="task-list">
      <li>
        <a href="/lab10/task1/">Задание 10.1: Интернет-магазин</a>
      </li>
      <li>
        <a href="/lab10/task2/">Задание 10.2: Расписание</a>
      </li>
    </ul>
  </body>
</html>
