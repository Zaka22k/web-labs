<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Задание 4</title>
  </head>
  <body>
    <h1>Контакты</h1>

    <section id="addContact">
      <h2>Добавить контакт</h2>
      <label>Фамилия <input type="text" id="lastName" /></label>
      <label>Имя <input type="text" id="firstName" /></label>
      <label>Возраст <input type="number" id="age" min="0" /></label>
      <label>Телефон <input type="text" id="phone" /></label>
      <button id="addBtn">Добавить контакт</button>
    </section>

    <section id="contactsList">
      <h2>Список контактов</h2>
      <table id="contactsTable">
        <thead>
          <tr>
            <th>
              Фамилия<br />
              <input type="text" id="filterLastName" placeholder="Фильтр" />
            </th>
            <th>
              Имя<br />
              <input type="text" id="filterFirstName" placeholder="Фильтр" />
            </th>
            <th>
              Возраст<br />
              <input type="text" id="filterAge" placeholder="Фильтр" />
            </th>
            <th>
              Телефон<br />
              <input type="text" id="filterPhone" placeholder="Фильтр" />
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="filterBtn">Применить фильтр</button>
    </section>

    <script src="script.js" defer></script>
  </body>
</html>
